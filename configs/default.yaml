seed: 0

data:
  topic: "rechargeable battery cells and battery systems for vehicles"
  cpc_prefixes: ["H01M10/", "B60L58/"]
  authorities: ["EP", "WO"]
  year_start: 2015
  year_end: 2024
  slice_year: 2020
  slice_month: 6
  slice_size: 300
  target_min: 3000
  target_max: 6000
  seeds_per_month: 7
  raw_dir: data/raw/ops
  corpus_dir: data/corpus
  fetch_state: data/fetch_state.json
  weekly_quota_bytes: 4000000000
  quota_stop_fraction: 0.8
  fetch_claims: true
  fetch_descriptions: false

graph:
  seeds_n: 20
  pool_n: 100
  cpc_top: 3
  cpc_level: group
  cpc_depth: 1
  citation_hops: 1
  max_candidates: 200
  use_cpc: true
  use_cite: true
  use_family: true
  use_rerank: true
  w_sim: 1.0
  w_cpc: 0.2
  w_cite: 0.2
  w_family: 0.0
  w_applicant: 0.1
  w_bm25: 0.0
  bm25_pool: 0
  seed_source: vector

hybrid:
  w_sim: 1.0
  w_bm25: 1.0
  pool_n: 100

# cross-encoder re-ranking of the hybrid top results; enabled only if tuning on validation
# queries shows a gain (results/tuned_params_<scope>.json)
rerank:
  enabled: false
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidates: [cross-encoder/ms-marco-MiniLM-L-6-v2, BAAI/bge-reranker-base]
  depth: 50
  alpha: 1.0

agent:
  max_steps: 10
  search_k: 20
  max_feature_searches: 4
  max_chart_items: 3
  max_reads: 3
  max_expansions: 2
  feature_weight: 0.5
  rrf_k: 60
  chart_boost: false

index:
  embedding_model: intfloat/multilingual-e5-small
  chroma_dir: stores/chroma
  bm25_dir: stores/bm25
  batch_size: 32
  max_seq_length: 256
  aggregation: max

evaluation:
  n_test: 300
  n_val: 100
  min_relevant: 3
  ks: [5, 10, 20]
  bootstrap_resamples: 1000

llm:
  backend: ollama
  model: qwen2.5:3b-instruct
  temperature: 0.0
  num_ctx: 4096

faithfulness:
  nli_model: cross-encoder/nli-deberta-v3-small
  max_retries: 2
  flag_if_either: true

api:
  max_query_chars: 4000
  max_k: 50
  timeout_s: 120
  report_timeout_s: 1800
  max_jobs: 50
  cors: false

sqlite_path: stores/sqlite/memory.db
