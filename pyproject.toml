[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patentrag"
version = "0.1.0"
description = "Agentic RAG for European patent prior-art search: hybrid retrieval, a tool-using LLM agent and verified claim charts"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "lxml>=5.0",
]

[project.optional-dependencies]
ml = [
  "numpy<2.4",
  "sentence-transformers",
  "chromadb",
  "rank-bm25",
  "neo4j>=5.20",
  "scipy",
  "matplotlib",
  "pandas",
]
serve = [
  "fastapi",
  "uvicorn",
  "prometheus-client",
  "mcp>=1.9,<2",
  "streamlit",
  "pyvis",
]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-cov",
  "pre-commit",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
patentrag = "patentrag.cli:app"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["patentrag*", "api*"]

[tool.ruff]
extend-exclude = ["colab"]
line-length = 100
target-version = "py311"
src = ["src", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "needs_cache: requires cached real OPS responses (skips if absent)",
  "needs_neo4j: requires a running Neo4j",
  "needs_models: requires downloaded ML models",
]

[tool.coverage.run]
source = ["src/patentrag", "api"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
