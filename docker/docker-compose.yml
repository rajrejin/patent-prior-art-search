# Graph database only:  docker compose --env-file .env -f docker/docker-compose.yml up -d neo4j
# Whole stack:          docker compose --env-file .env -f docker/docker-compose.yml --profile app up -d --build
# (scripts/up.ps1 does this). Ollama runs on the host to save RAM.
name: patentrag

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: patentrag-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j_data:/data
    deploy:
      resources:
        limits:
          memory: 2200M
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: patentrag-api
    container_name: patentrag-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      OLLAMA_HOST: http://host.docker.internal:11434
      PATENTRAG_API_KEY: "${PATENTRAG_API_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../data/corpus:/app/data/corpus:ro
      - ../stores:/app/stores
      - ../results:/app/results:ro
    deploy:
      resources:
        limits:
          memory: 2G

  app:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    image: patentrag-app
    container_name: patentrag-app
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PATENTRAG_API_URL: http://api:8000
      PATENTRAG_API_KEY: "${PATENTRAG_API_KEY:-}"
      PATENTRAG_RESULTS: /app/results
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ../results:/app/results:ro
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  neo4j_data:
